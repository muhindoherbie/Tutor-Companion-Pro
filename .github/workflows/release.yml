name: Build & Release Desktop (.exe) and Android (.apk)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  build-windows:
    name: Build Windows Desktop .exe
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Web Application
        run: npm run build

      - name: Prepare Electron packaging config
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          VERSION="${VERSION#.}"
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            p.main = 'electron.cjs';
            p.version = process.argv[1];
            delete p.build.win.icon;
            p.build.win.target = ['nsis'];
            p.build.files = ['dist/**/*', 'electron.cjs', 'package.json'];
            p.build.nsis = { oneClick: false, allowToChangeInstallationDirectory: true, artifactName: 'TutorCompanion-Setup-Windows.\${ext}' };
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2));
          " "$VERSION"
          npm install --save-dev --no-audit --no-fund electron@33 electron-builder@25

      - name: Package Windows Executable (.exe)
        run: npx electron-builder --win --x64 --publish never

      - name: Upload Windows .exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TutorCompanion-Windows-Setup
          path: dist-electron/*.exe
          if-no-files-found: error

  build-android:
    name: Build Android .apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies & Build Web App
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Build Android APK with Capacitor
        run: |
          npm install --no-audit --no-fund @capacitor/cli@7 @capacitor/core@7 @capacitor/android@7
          npx cap init "Tutor Companion" "com.tutorcompanion.app" --web-dir "dist"
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cd ..
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk "release-apk/TutorCompanion-Android-${RELEASE_TAG}.apk"

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TutorCompanion-Android-APK
          path: release-apk/*.apk
          if-no-files-found: error

  publish-github-release:
    name: Publish Public GitHub Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: TutorCompanion-Windows-Setup
          path: release-assets/windows

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: TutorCompanion-Android-APK
          path: release-assets/android

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Tutor Companion ${{ env.RELEASE_TAG }} (Windows .exe & Android .apk)
          body: |
            ## Tutor Companion Official Release

            ### Downloads:
            - 🖥️ **Windows PC**: `TutorCompanion-Setup-Windows.exe` (installer for Windows 10/11)
            - 📱 **Android**: `TutorCompanion-Android-${{ env.RELEASE_TAG }}.apk` (Android 8.0+, debug-signed — allow "Install unknown apps")

            ### Highlights in this Release:
            - **Curriculum & Teacher's Guide Ingestion**: Automatic syllabus breakdown, courses, units, and learning objectives.
            - **Lecture Notes Studio**: Contact hour structured notes with instant PPTX, DOCX, and PDF exports.
            - **Exam & Assessment Engine**: Standard & substandard exams, question banks, and complete marking schemes.
            - **Academic Gradebook**: Student biodata, continuous assessment, GPA computation, and CSV exports.
            - **Deep Solve AI Assistant**: Dedicated tutor solver with voice, image, document, and text query support.
            - **Offline-First Resilience**: Full offline operation with persistent storage and backup sync.
          files: |
            release-assets/windows/*.exe
            release-assets/android/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
