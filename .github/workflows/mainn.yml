name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (for manual runs)'
        required: false
        default: ''
      release_name:
        description: 'Release name'
        required: false
        default: ''
      release_body:
        description: 'Release notes'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run tests
        run: npm test --if-present

      - name: Build
        run: npm run build --if-present

      - name: Create release archive
        id: package
        run: |
          mkdir -p release
          if [ -d dist ]; then
            zip -r release/artifact.zip dist
          else
            zip -r release/artifact.zip . -x ".git/*" "release/*"
          fi
          echo "archive-path=release/artifact.zip" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: ${{ steps.package.outputs.archive-path }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: release

      - name: Determine tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "TAG=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            REF="${GITHUB_REF#refs/tags/}"
            echo "TAG=$REF" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          release_name: ${{ github.event.inputs.release_name || steps.tag.outputs.TAG }}
          body: ${{ github.event.inputs.release_body || 'Release created by CI' }}
          draft: false
          prerelease: false

      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: release/artifact.zip
          asset_name: build-${{ steps.tag.outputs.TAG }}.zip
          asset_content_type: application/zip
